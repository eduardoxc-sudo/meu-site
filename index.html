<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo Inteligente - Plano & Ciclo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-hover: #1f293d;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --card-bg: #131c2e;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.12);
      --accent: #4f46e5;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    #tela-login {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .login-box h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
      color: var(--primary);
    }

    .login-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    #app-container {
      display: none;
      width: 100%;
      min-height: 100vh;
      flex-direction: row;
    }

    @media (max-width: 900px) {
      #app-container { flex-direction: column; }
      aside { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--border); }
      main { padding: 16px !important; }
    }

    aside {
      width: 390px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .user-tag {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tab-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 8px 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.70rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-color: transparent;
    }

    .tab-content {
      display: none;
      padding: 18px;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .tab-content.active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input, select, textarea {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #0b0f19; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: transparent; border: 1px solid rgba(239, 68, 68, 0.4); color: var(--danger); }

    main { flex: 1; padding: 32px; overflow-y: auto; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .main-header h1 { font-size: 1.6rem; font-weight: 700; }
    .controls-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .week-navigator { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
    .week-label { font-size: 0.85rem; font-weight: 600; color: var(--primary); min-width: 170px; text-align: center; }

    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .day-column { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 250px; }
    .day-column.today { border-color: var(--primary); }

    .day-name { padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
    .day-title-text { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
    .day-date-tag { font-size: 0.78rem; color: var(--text-muted); }

    .slot-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .slot-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .slot-card.done { border-color: var(--success); opacity: 0.65; }
    .slot-card.done .slot-materia-title, .slot-card.done .slot-assunto-sub { text-decoration: line-through; color: var(--text-muted); }

    .slot-materia-title { font-weight: 700; color: var(--primary); font-size: 0.85rem; display: block; }
    .slot-assunto-sub { font-size: 0.78rem; color: var(--text); }

    .badge-numero-cartao {
      display: inline-flex; font-size: 0.68rem; font-weight: 800; padding: 2px 7px;
      border-radius: 5px; background: rgba(56, 189, 248, 0.15); color: var(--primary); margin-bottom: 2px;
    }

    .slot-card.cartao-revisao {
      border: 2px solid #8b5cf6 !important;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(99, 102, 241, 0.08)) !important;
    }
    .tag-badge-revisao {
      display: inline-flex; font-size: 0.65rem; font-weight: 800; padding: 2px 6px;
      border-radius: 4px; background: #8b5cf6; color: #ffffff; margin-bottom: 2px;
    }

    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <div id="tela-login">
    <div class="login-box">
      <h2>Estudo Inteligente</h2>
      <p>Introduza os dados para aceder ao painel</p>
      <div class="field" style="margin-bottom: 12px;">
        <label for="usuario">Utilizador</label>
        <input type="text" id="usuario" value="Eduardo">
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label for="senha">Palavra-passe</label>
        <input type="password" id="senha" value="333435">
      </div>
      <div id="msgErro" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 12px; display: none; text-align: center;">Dados incorretos!</div>
      <button class="btn btn-primary" style="width: 100%;" onclick="autenticar()">Entrar no Painel</button>
    </div>
  </div>

  <div id="app-container">
    <aside>
      <div class="sidebar-header">
        <h2>📚 Estudo Inteligente</h2>
        <div class="user-tag">Perfil: <span id="labelNomeUsuario" class="user-badge">Eduardo</span></div>
      </div>

      <nav class="tab-nav">
        <button class="tab-btn active" onclick="trocarAba('aba-ciclo', this)">Ciclo</button>
        <button class="tab-btn" onclick="trocarAba('aba-edital-vert', this)">Edital</button>
      </nav>

      <!-- Aba Ciclo -->
      <div id="aba-ciclo" class="tab-content active">
        <div class="field">
          <label>Adicionar Disciplina</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="novaMateria" placeholder="Ex: Português">
            <button class="btn btn-primary" onclick="adicionarMateria()">+</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="gerarSemana()">⚡ Atualizar Semana Atual</button>
        <button class="btn btn-outline" onclick="reiniciarProgresso()">Limpar Checkboxes</button>
      </div>

      <!-- Aba Edital -->
      <div id="aba-edital-vert" class="tab-content">
        <div class="field">
          <label>Adicionar Tópico ao Edital</label>
          <div style="display: flex; gap: 6px; margin-bottom: 6px;">
            <input type="text" id="inputMateriaTopico" placeholder="Matéria" style="flex:1;">
            <input type="text" id="inputTituloTopico" placeholder="Assunto do tópico" style="flex:1.5;">
          </div>
          <button class="btn btn-primary" onclick="adicionarTopico()">Adicionar Tópico</button>
        </div>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Marque as caixas 1D, 7D, 15D ou 30D para agendar revisões automáticas no futuro.</p>
        <div id="containerEdital" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-danger" onclick="resetarTudo()">🔄 Resetar Tudo</button>
        <button class="btn btn-outline" onclick="sair()">Terminar Sessão</button>
      </div>
    </aside>

    <main>
      <header class="main-header">
        <div>
          <h1>Cronograma Semanal</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Ciclo de matérias com numeração de cartões e revisões</p>
        </div>
        <div class="controls-top">
          <div class="week-navigator">
            <button class="btn btn-outline" style="padding: 4px 10px;" onclick="navegarSemana(-1)">◀</button>
            <span class="week-label" id="labelIntervaloSemana">...</span>
            <button class="btn btn-outline" style="padding: 4px 10px;" onclick="navegarSemana(1)">▶</button>
          </div>
          <button class="btn btn-primary" style="padding: 6px 10px;" onclick="irParaHoje()">↺ Hoje</button>
          <button class="btn btn-outline" onclick="alternarTema()" id="btnTema">☀️ Claro</button>
        </div>
      </header>

      <section class="week-grid" id="gradeSemana"></section>
    </main>
  </div>

  <script>
    const DIAS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
    let usuarioAtivo = null;
    let dataReferencia = new Date();
    let chaveSemanaAtiva = '';
    let estado = {
      disciplinas: [],
      editalVerticalizado: {},
      semanas: {},
      ponteiroGeral: 0,
      agendaRevisoes: [],
      tema: 'dark'
    };

    function autenticar() {
      const u = document.getElementById('usuario').value.trim();
      const s = document.getElementById('senha').value.trim();
      if (u.toLowerCase() === 'eduardo' && s === '333435') {
        usuarioAtivo = 'Eduardo';
        sessionStorage.setItem('usuario_ativo', 'Eduardo');
        abrirApp();
      } else {
        const erro = document.getElementById('msgErro');
        if (erro) erro.style.display = 'block';
      }
    }

    function abrirApp() {
      const telaLogin = document.getElementById('tela-login');
      const appContainer = document.getElementById('app-container');
      if (telaLogin) telaLogin.style.display = 'none';
      if (appContainer) appContainer.style.display = 'flex';
      
      const salvo = localStorage.getItem('estudo_inteligente_dados_v4');
      if (salvo) {
        try { estado = JSON.parse(salvo); } catch(e) {}
      } else {
        estado.disciplinas = [{nome: 'Português', peso: 3}, {nome: 'Raciocínio Lógico', peso: 2}];
        estado.editalVerticalizado = {
          'Português': [{id:'t1', titulo:'1. Interpretação de Textos', t:false}, {id:'t2', titulo:'2. Crase', t:false}],
          'Raciocínio Lógico': [{id:'t3', titulo:'1. Proposições', t:false}]
        };
      }
      dataReferencia = new Date();
      atualizarUI();
    }

    function salvarEstado() {
      localStorage.setItem('estudo_inteligente_dados_v4', JSON.stringify(estado));
    }

    function trocarAba(id, btn) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      if (id === 'aba-edital-vert') renderizarEdital();
    }

    function alternarTema() {
      estado.tema = estado.tema === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', estado.tema);
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Claro' : '🌙 Escuro';
      salvarEstado();
    }

    function adicionarMateria() {
      const input = document.getElementById('novaMateria');
      const nome = input.value.trim();
      if (!nome) return;
      if (!estado.disciplinas.some(d => d.nome === nome)) {
        estado.disciplinas.push({ nome, peso: 3 });
        if (!estado.editalVerticalizado[nome]) estado.editalVerticalizado[nome] = [];
        input.value = '';
        salvarEstado();
        gerarSemana();
      }
    }

    function adicionarTopico() {
      const m = document.getElementById('inputMateriaTopico').value.trim();
      const t = document.getElementById('inputTituloTopico').value.trim();
      if (!m || !t) return;
      if (!estado.editalVerticalizado[m]) {
        estado.editalVerticalizado[m] = [];
        if (!estado.disciplinas.some(d => d.nome === m)) estado.disciplinas.push({ nome: m, peso: 3 });
      }
      estado.editalVerticalizado[m].push({ id: 'tp_' + Date.now(), titulo: t, t: false });
      document.getElementById('inputMateriaTopico').value = '';
      document.getElementById('inputTituloTopico').value = '';
      salvarEstado();
      renderizarEdital();
      gerarSemana();
    }

    function renderizarEdital() {
      const c = document.getElementById('containerEdital');
      if (!c) return; c.innerHTML = '';
      Object.keys(estado.editalVerticalizado || {}).forEach(m => {
        const tops = estado.editalVerticalizado[m] || [];
        const bloco = document.createElement('div');
        bloco.className = 'item-card';
        bloco.style.flexDirection = 'column';
        bloco.style.alignItems = 'flex-start';
        bloco.style.gap = '6px';
        
        let topsHtml = tops.map(t => `
          <div style="display:flex; justify-content:space-between; width:100%; align-items:center; font-size:0.8rem; gap:6px;">
            <span style="flex:1;">${t.titulo}</span>
            <label style="font-size:0.65rem;"><input type="checkbox" ${t.r1?'checked':''} onchange="marcarRevisao('${m}','${t.id}','1D',this.checked)"> 1D</label>
            <label style="font-size:0.65rem;"><input type="checkbox" ${t.r7?'checked':''} onchange="marcarRevisao('${m}','${t.id}','7D',this.checked)"> 7D</label>
            <label style="font-size:0.65rem;"><input type="checkbox" ${t.r15?'checked':''} onchange="marcarRevisao('${m}','${t.id}','15D',this.checked)"> 15D</label>
            <label style="font-size:0.65rem;"><input type="checkbox" ${t.r30?'checked':''} onchange="marcarRevisao('${m}','${t.id}','30D',this.checked)"> 30D</label>
          </div>
        `).join('');

        bloco.innerHTML = `<strong>${m}</strong>${topsHtml || '<span style="font-size:0.75rem; color:var(--text-muted);">Sem tópicos</span>'}`;
        c.appendChild(bloco);
      });
    }

    function marcarRevisao(materia, topicoId, tipo, ativo) {
      const topico = (estado.editalVerticalizado[materia] || []).find(t => t.id === topicoId);
      if (!topico) return;
      topico['r' + tipo.replace('D', '')] = ativo;

      const diasMap = { '1D': 1, '7D': 7, '15D': 15, '30D': 30 };
      if (!estado.agendaRevisoes) estado.agendaRevisoes = [];

      if (ativo) {
        const dRev = new Date();
        dRev.setDate(dRev.getDate() + diasMap[tipo]);
        estado.agendaRevisoes.push({
          id: 'rev_' + Math.random().toString(36).substr(2, 6),
          materia, topicoTitulo: topico.titulo, tipo, dataPrevista: formatarDataChave(dRev), concluida: false
        });
      } else {
        estado.agendaRevisoes = estado.agendaRevisoes.filter(r => !(r.materia === materia && r.topicoTitulo === topico.titulo && r.tipo === tipo));
      }
      salvarEstado();
      gerarSemana();
    }

    function obterTotalTopicos() {
      let total = 0;
      Object.keys(estado.editalVerticalizado || {}).forEach(m => {
        total += (estado.editalVerticalizado[m] || []).length;
      });
      return total;
    }

    function obterSegundaFeira(data) {
      const d = new Date(data);
      const diaSemana = d.getDay();
      const diff = (diaSemana === 0 ? -6 : 1) - diaSemana;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function formatarDataChave(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function obterDiasDaSemana(segunda) {
      return DIAS.map((nome, index) => {
        const dataDia = new Date(segunda);
        dataDia.setDate(segunda.getDate() + index);
        const formatada = `${String(dataDia.getDate()).padStart(2, '0')}/${String(dataDia.getMonth() + 1).padStart(2, '0')}`;
        return { nome, data: formatada, dataCompleta: dataDia };
      });
    }

    function atualizarSemanaAtiva() {
      const segunda = obterSegundaFeira(dataReferencia);
      chaveSemanaAtiva = `semana_${formatarDataChave(segunda)}`;
      const domingo = new Date(segunda); domingo.setDate(segunda.getDate() + 6);
      
      const lbl = document.getElementById('labelIntervaloSemana');
      if (lbl) {
        lbl.innerText = `${String(segunda.getDate()).padStart(2, '0')}/${String(segunda.getMonth() + 1).padStart(2, '0')} - ${String(domingo.getDate()).padStart(2, '0')}/${String(domingo.getMonth() + 1).padStart(2, '0')}/${domingo.getFullYear()}`;
      }

      if (!estado.semanas) estado.semanas = {};
      if (!estado.semanas[chaveSemanaAtiva]) {
        gerarSemanaAutomaticaCorrigida(chaveSemanaAtiva);
      }
      renderizarGrade();
    }

    function navegarSemana(delta) {
      dataReferencia.setDate(dataReferencia.getDate() + (delta * 7));
      atualizarSemanaAtiva();
    }

    function irParaHoje() {
      dataReferencia = new Date();
      atualizarSemanaAtiva();
    }

    function gerarSemanaAutomaticaCorrigida(chaveSem) {
      if (!estado.disciplinas || estado.disciplinas.length === 0) return;
      const ciclo = [];
      estado.disciplinas.forEach(d => { for(let i=0; i<(d.peso || 3); i++) ciclo.push(d.nome); });
      if (ciclo.length === 0) return;

      const novaSemana = {};
      let ponteiro = estado.ponteiroGeral || 0;
      const totalTopicos = obterTotalTopicos();
      const partes = chaveSem.replace('semana_', '').split('-');
      const segundaRef = new Date(partes[0], partes[1] - 1, partes[2]);

      DIAS.forEach((dia, idx) => {
        const dataDia = new Date(segundaRef);
        dataDia.setDate(segundaRef.getDate() + idx);
        const chaveDia = formatarDataChave(dataDia);
        const slotsDia = [];

        (estado.agendaRevisoes || []).forEach(rev => {
          if (rev.dataPrevista === chaveDia && !rev.concluida) {
            slotsDia.push({
              id: rev.id, materia: rev.materia, assunto: `Revisão: ${rev.topicoTitulo}`,
              isRevisaoEspacada: true, tipoRevisao: rev.tipo, feito: false
            });
          }
        });

        while (slotsDia.length < 2) {
          if (totalTopicos > 0 && ponteiro >= totalTopicos) break;
          const materia = ciclo[ponteiro % ciclo.length];
          const topicosMat = (estado.editalVerticalizado[materia] || []).filter(t => !t.t);
          const topicoEscolhido = topicosMat.length > 0 ? topicosMat[0] : null;
          const numCartao = (ponteiro % (totalTopicos || 1)) + 1;

          slotsDia.push({
            id: 'slot_' + Math.random().toString(36).substr(2,6),
            materia: materia,
            assunto: topicoEscolhido ? topicoEscolhido.titulo : 'Revisão Geral',
            topicoId: topicoEscolhido ? topicoEscolhido.id : null,
            numeroCartao: numCartao,
            feito: false
          });
          ponteiro++;
        }
        novaSemana[dia] = slotsDia;
      });

      estado.ponteiroGeral = ponteiro;
      estado.semanas[chaveSem] = novaSemana;
      salvarEstado();
    }

    function gerarSemana() {
      gerarSemanaAutomaticaCorrigida(chaveSemanaAtiva);
      renderizarGrade();
      alert('Semana atualizada com sucesso!');
    }

    function renderizarGrade() {
      const grade = document.getElementById('gradeSemana');
      if (!grade) return;
      grade.innerHTML = '';

      const totalGeralTopicos = obterTotalTopicos();
      const segunda = obterSegundaFeira(dataReferencia);
      const dias = obterDiasDaSemana(segunda);
      const hojeChave = formatarDataChave(new Date());
      const semana = estado.semanas[chaveSemanaAtiva] || {};

      dias.forEach(diaInfo => {
        const chaveDia = formatarDataChave(diaInfo.dataCompleta);
        const slots = semana[diaInfo.nome] || [];
        const col = document.createElement('div');
        col.className = 'day-column';
        if (chaveDia === hojeChave) col.classList.add('today');

        let htmlSlots = '';
        slots.forEach((slot, idx) => {
          const isRev = slot.isRevisaoEspacada === true;
          let badgeNum = (!isRev && slot.numeroCartao && totalGeralTopicos > 0)
            ? `<span class="badge-numero-cartao">#${slot.numeroCartao} de ${totalGeralTopicos}</span>` : '';
          let badgeRev = isRev ? `<span class="tag-badge-revisao">⏰ REVISÃO ${slot.tipoRevisao}</span>` : '';

          htmlSlots += `
            <div class="slot-card ${slot.feito ? 'done' : ''} ${isRev ? 'cartao-revisao' : ''}">
              <div class="slot-left">
                <input type="checkbox" ${slot.feito ? 'checked' : ''} onchange="toggleSlot('${diaInfo.nome}', ${idx}, this.checked)">
                <div class="slot-texts">
                  ${badgeNum} ${badgeRev}
                  <span class="slot-materia-title">${slot.materia}</span>
                  <span class="slot-assunto-sub">${slot.assunto}</span>
                </div>
              </div>
            </div>
          `;
        });

        if (slots.length === 0) htmlSlots = `<div style="font-size:0.78rem; color:var(--text-muted); text-align:center;">Livre</div>`;

        col.innerHTML = `
          <div class="day-name">
            <span class="day-title-text">${diaInfo.nome}</span>
            <span class="day-date-tag">${diaInfo.data}</span>
          </div>
          <div class="slot-list">${htmlSlots}</div>
        `;
        grade.appendChild(col);
      });
    }

    function toggleSlot(dia, idx, valor) {
      const semana = estado.semanas[chaveSemanaAtiva];
      if (!semana || !semana[dia] || !semana[dia][idx]) return;
      
      const slot = semana[dia][idx];
      slot.feito = valor;

      if (slot.topicoId) {
        Object.keys(estado.editalVerticalizado).forEach(m => {
          (estado.editalVerticalizado[m] || []).forEach(t => { if (t.id === slot.topicoId) t.t = valor; });
        });
      }
      salvarEstado();
      renderizarGrade();
    }

    function reiniciarProgresso() {
      if (!confirm('Limpar marcações de feito?')) return;
      const semana = estado.semanas[chaveSemanaAtiva];
      if (semana) { Object.keys(semana).forEach(d => semana[d].forEach(s => s.feito = false)); }
      salvarEstado();
      renderizarGrade();
    }

    function resetarTudo() {
      if (!confirm('Deseja apagar todos os dados e reiniciar?')) return;
      localStorage.removeItem('estudo_inteligente_dados_v4');
      location.reload();
    }

    function sair() {
      sessionStorage.removeItem('usuario_ativo');
      location.reload();
    }

    function atualizarUI() {
      document.documentElement.setAttribute('data-theme', estado.tema || 'dark');
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Claro' : '🌙 Escuro';
      atualizarSemanaAtiva();
    }

    const sessao = sessionStorage.getItem('usuario_ativo');
    if (sessao && sessao.toLowerCase() === 'eduardo') {
      usuarioAtivo = 'Eduardo';
      document.getElementById('labelNomeUsuario').innerText = 'Eduardo';
      abrirApp();
    }
  </script>
</body>
</html>
