<style>
:root{--bg:#0b0f19;--surface:#111827;--card:#131c2e;--border:#263244;--text:#f3f4f6;--muted:#9ca3af;--primary:#38bdf8;--accent:#6366f1;--success:#10b981;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}body{background:var(--bg);color:var(--text);min-height:100vh}.hidden{display:none!important}
button,input{font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(390px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 20px 50px #0006}.login-card h1{font-size:1.45rem;text-align:center;color:var(--primary);margin-bottom:8px}.login-card p{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:22px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:.76rem;color:var(--muted);font-weight:700}.field input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px 12px;outline:none}.field input:focus{border-color:var(--primary)}#loginStatus{min-height:20px;font-size:.78rem;margin-top:10px;text-align:center;color:var(--muted)}
#app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}aside{background:var(--surface);border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:18px}.brand h2{color:var(--primary);font-size:1.05rem}.user{color:var(--muted);font-size:.78rem;margin-top:5px}.sync{font-size:.75rem;color:var(--success);margin-top:5px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:9px;padding:10px;cursor:pointer;font-weight:700}.nav button.active{background:#172238;color:#fff;border-color:var(--border)}.aside-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{font-size:1.55rem}.version{font-size:.72rem;color:var(--muted);border:1px solid var(--border);padding:5px 8px;border-radius:8px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#111827,#172238);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}.hero h2{font-size:1.25rem;margin-bottom:5px}.hero p{color:var(--muted);font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}.stat span{font-size:.75rem;color:var(--muted);font-weight:700}.stat strong{display:block;margin-top:7px;font-size:1.25rem}.placeholder{background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:22px;color:var(--muted);line-height:1.6}.ok{color:var(--success)}
@media(max-width:800px){#app{display:block}aside{border-right:0;border-bottom:1px solid var(--border)}.nav{display:grid;grid-template-columns:repeat(2,1fr)}main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}

.edital-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.panel h3{font-size:1rem;margin-bottom:6px}.panel-sub{font-size:.78rem;color:var(--muted);line-height:1.5;margin-bottom:14px}
textarea,select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px 11px;outline:none;width:100%}
textarea:focus,select:focus{border-color:var(--primary)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn-danger{background:#7f1d1d;color:#fff}.btn-success{background:#065f46;color:#fff}
.edital-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.edital-summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.edital-summary strong{color:var(--primary)}
.materia-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;background:#0f172a}
.materia-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--border)}
.materia-head h4{font-size:.92rem}.materia-count{font-size:.72rem;color:var(--muted)}
.topico-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid #1e293b}
.topico-row:last-child{border-bottom:0}.topico-row.done .topico-title{text-decoration:line-through;color:#64748b}
.topico-title{font-size:.82rem;line-height:1.45}.mini{font-size:.7rem;padding:5px 7px;border-radius:7px}
.add-row{display:grid;grid-template-columns:180px 1fr auto;gap:8px;margin-bottom:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
.status-line{font-size:.76rem;color:var(--muted);margin-top:9px;min-height:18px}
@media(max-width:1000px){.edital-layout{grid-template-columns:1fr}.edital-toolbar{grid-template-columns:1fr}.add-row{grid-template-columns:1fr}}

/* ===== V4 DEV — CICLO V1 ===== */
.ciclo-grid{display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);gap:16px}
.ciclo-list{display:grid;gap:9px}
.ciclo-item{display:grid;grid-template-columns:auto 1fr 110px auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px}
.ciclo-item.off{opacity:.55}
.ciclo-item strong{font-size:.84rem}
.ciclo-item small{display:block;color:var(--muted);font-size:.69rem;margin-top:3px}
.ciclo-item input[type="number"]{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}
.ciclo-ordem{display:flex;gap:5px}
.ciclo-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.ciclo-resumo div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px}
.ciclo-resumo span{display:block;color:var(--muted);font-size:.68rem;font-weight:700}
.ciclo-resumo strong{display:block;margin-top:5px;font-size:1rem;color:var(--primary)}
.ciclo-vazio{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:11px}
@media(max-width:1000px){.ciclo-grid{grid-template-columns:1fr}.ciclo-item{grid-template-columns:auto 1fr 95px}.ciclo-ordem{grid-column:2/4}}


/* ===== V5 DEV — EXECUÇÃO DO CICLO ===== */
.ciclo-exec{margin-top:16px}
.ciclo-exec-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}
.ciclo-proxima{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px}
.ciclo-proxima .tag{font-size:.67rem;color:var(--muted);font-weight:800;letter-spacing:.06em}
.ciclo-proxima h3{margin:7px 0 4px;color:var(--primary);font-size:1.2rem}
.ciclo-proxima p{margin:0;color:var(--muted);font-size:.8rem}
.ciclo-posicao{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px}
.ciclo-posicao strong{display:block;font-size:1.25rem;margin-top:6px}
.ciclo-exec-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ciclo-fila{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
.ciclo-fila span{border:1px solid var(--border);background:var(--surface);padding:6px 9px;border-radius:999px;font-size:.7rem;color:var(--muted)}
.ciclo-fila span.atual{border-color:var(--primary);color:var(--primary);font-weight:800}
@media(max-width:850px){.ciclo-exec-grid{grid-template-columns:1fr}}


/* ===== V6 DEV — PLANEJAMENTO V1 ===== */
.plan-grid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:16px}
.plan-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px}
.plan-dias{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.plan-dia{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--surface)}
.plan-revisoes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.plan-rev{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:10px;background:var(--surface)}
.plan-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.plan-resumo div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px}
.plan-resumo span{display:block;color:var(--muted);font-size:.67rem;font-weight:800}
.plan-resumo strong{display:block;margin-top:5px;color:var(--primary);font-size:1rem}
.plan-aviso{margin-top:12px;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:12px;color:var(--muted);font-size:.78rem;line-height:1.5}
@media(max-width:900px){.plan-grid{grid-template-columns:1fr}.plan-dias,.plan-revisoes{grid-template-columns:1fr}.plan-resumo{grid-template-columns:1fr}}


/* ===== V7 DEV — MOTOR DE REVISÕES ===== */
.revdev{margin-top:18px}.revdev-list{display:grid;gap:8px;margin-top:10px;max-height:390px;overflow:auto}
.revdev-item{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:11px}
.revdev-item b{display:block}.revdev-item small{color:var(--muted)}
.revdev-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.revdev-chip{font-size:.67rem;border:1px solid var(--border);border-radius:999px;padding:5px 8px;color:var(--primary)}


/* ===== V8 DEV — ESTUDO REAL + REVISÕES ===== */
.estudo-real{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.estudo-real-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px}
.estudo-real-box .rotulo{font-size:.67rem;color:var(--muted);font-weight:800;letter-spacing:.05em}
.estudo-real-box h4{margin:7px 0 5px;font-size:1rem}
.estudo-real-box p{margin:0 0 10px;color:var(--muted);font-size:.76rem;line-height:1.45}
.estudo-real-ok{color:#22c55e}

/* V10.4.6 — checklist real + regeneração somente de pendentes */
.ciclo-check-v1045{width:22px;height:22px;accent-color:#22c55e;cursor:pointer;flex:0 0 auto}
.ciclo-check-v1045:disabled{cursor:not-allowed;opacity:.75}
.ciclo-hoje-item.done .ciclo-check-v1045{filter:saturate(.75)}
#planRegenerarPendentesV1045{background:#16243a;color:#fff;border:1px solid #334968;border-radius:9px;padding:9px 12px;font-weight:700}
#planRegenerarPendentesV1045:disabled{opacity:.45;cursor:not-allowed}

#btnConcluirEstudoReal:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.55);pointer-events:none}

/* V10.2.0 — Planejamento por data */
.v102-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:16px 0}
.v102-toolbar label{display:flex;flex-direction:column;gap:6px;color:#9fb7d5;font-size:13px}
.v102-toolbar input,.v102-toolbar select{background:#0b1220;color:#fff;border:1px solid #2a3b55;border-radius:9px;padding:9px 10px}
.v101-plan-group .v101-plan-item>div{width:100%;max-width:none}
.v102-toolbar button,.v102-actions button{cursor:pointer}
.v102-day{border:1px solid #2a3b55;border-radius:14px;overflow:hidden;margin:14px 0;background:#0b1220}
.v102-day-head{padding:12px 14px;background:#111c2e;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.v102-topic{display:grid;grid-template-columns:58px 72px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #223149}
.v102-num{font-weight:900;font-size:18px;text-align:center}
.v102-main strong{display:block}.v102-main small{color:#91abc9}
.v102-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.v102-actions input{width:135px;background:#0b1220;color:#fff;border:1px solid #2a3b55;border-radius:8px;padding:7px}
.v102-actions button{background:#16243a;color:#fff;border:1px solid #334968;border-radius:8px;padding:7px 9px}
@media(max-width:760px){.v102-topic{grid-template-columns:45px 62px 1fr}.v102-actions{grid-column:1/-1;padding-left:0}.v102-actions input{flex:1}}

/* ===== V10.3.0 — Planejamento integrado ao Ciclo ===== */
.ciclo-hoje-lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ciclo-hoje-item{display:grid;grid-template-columns:44px 72px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.ciclo-hoje-item.done{opacity:.58}
.ciclo-hoje-num{font-weight:900;color:var(--primary);text-align:center}
.ciclo-hoje-main strong{display:block}.ciclo-hoje-main small{display:block;color:var(--muted);margin-top:3px}
@media(max-width:650px){.ciclo-hoje-item{grid-template-columns:38px 64px minmax(0,1fr)}}

/* ===== V10.2.2 — mover assuntos no Ciclo ===== */
.ciclo-assuntos{margin-top:16px}
.ciclo-assuntos-grupo{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:10px;background:var(--bg)}
.ciclo-assuntos-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;background:#111c2e;font-weight:800}
.ciclo-assunto-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--border)}
.ciclo-assunto-row.done{opacity:.58}
.ciclo-assunto-num{font-weight:900;text-align:center;color:var(--primary)}
.ciclo-assunto-main strong{display:block;font-size:.82rem;line-height:1.4}
.ciclo-assunto-main small{display:block;color:var(--muted);font-size:.68rem;margin-top:3px}
.ciclo-assunto-acoes{display:flex;gap:5px}
@media(max-width:700px){.ciclo-assunto-row{grid-template-columns:42px minmax(0,1fr)}.ciclo-assunto-acoes{grid-column:2}}

.ciclo-hoje-sub{margin:10px 0 6px;padding:6px 2px;color:#b9d7ff}.ciclo-hoje-concl{margin-top:16px;color:#9fb0c7}

/* V10.4.0 — VISÃO SEMANAL DO CICLO */
.ciclo-semana-v104{margin-top:18px}
.ciclo-semana-toolbar-v104{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}
.ciclo-semana-toolbar-v104 .acoes{display:flex;gap:8px;flex-wrap:wrap}
.ciclo-semana-grid-v104{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;width:100%;overflow:visible;padding-bottom:6px}
.ciclo-dia-v104{min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--bg);overflow:hidden}
.ciclo-dia-v104.hoje{outline:2px solid var(--primary);outline-offset:-2px}
.ciclo-dia-head-v104{padding:10px;background:#111c2e;border-bottom:1px solid var(--border)}
.ciclo-dia-head-v104 b,.ciclo-dia-head-v104 small{display:block}
.ciclo-dia-head-v104 small{color:var(--muted);margin-top:2px}
.ciclo-dia-body-v104{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:110px}
.ciclo-card-v104{border:1px solid var(--border);border-radius:10px;padding:9px;background:#0b1220}
.ciclo-card-v104.done{opacity:.58}
.ciclo-card-v104 .linha{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ciclo-card-v104 strong{display:block;font-size:.9rem;line-height:1.25}
.ciclo-card-v104 small{display:block;color:var(--muted);margin-top:4px}
.ciclo-card-v104[data-agenda-id]{cursor:grab;transition:border-color .15s,transform .15s,opacity .15s;user-select:none}.ciclo-card-v104[data-agenda-id]:hover{border-color:var(--primary);transform:translateY(-1px)}
.ciclo-card-v104[data-agenda-id]:active{cursor:grabbing}
.ciclo-card-v104.dragging-v104{opacity:.35;transform:scale(.98)}
.ciclo-dia-body-v104.drop-v104{outline:2px dashed var(--primary);outline-offset:-4px;background:rgba(56,189,248,.06)}
.ciclo-dia-vazio-v104{color:var(--muted);font-size:.82rem;padding:8px 4px}
@media(max-width:900px){.ciclo-semana-grid-v104{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.ciclo-semana-grid-v104{grid-template-columns:1fr}}

/* V10.4.16 — Progresso restaurado */
.prog-prior-v10416{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.prog-prior-card-v10416,.prog-mat-v10416{border:1px solid var(--border);background:rgba(6,12,24,.55);border-radius:12px;padding:12px}
.prog-prior-card-v10416 strong{display:block;font-size:20px;margin-top:4px}
.prog-mat-v10416{margin-top:10px}
.prog-mat-head-v10416{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.prog-mat-head-v10416 b{font-size:16px}.prog-mat-head-v10416 span{white-space:nowrap;color:var(--muted)}
.prog-track-v10416{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-track-v10416 i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#6366f1);border-radius:999px}
.prog-mat-meta-v10416{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
@media(max-width:760px){.prog-prior-v10416{grid-template-columns:1fr}.prog-mat-head-v10416{align-items:flex-start;flex-direction:column}}
</style>

<style id="v903-historico-2x2-fixo">
#resumoHistoricoV90{
  width:100% !important;
  max-width:100% !important;
