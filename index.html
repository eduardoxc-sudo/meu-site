<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 40px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #7dd3fc;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #contador {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Site no Ar! 🚀</h1>
    <p>Este é o meu primeiro projeto publicado diretamente pelo GitHub Pages. Agora está visível para qualquer pessoa no mundo.</p>
    
    <button class="btn" onclick="contarCliques()">Clique aqui</button>
    <div id="contador">Cliques: 0</div>
  </div>

  <script>
    let cliques = 0;
    function contarCliques() {
      cliques++;
      document.getElementById('contador').innerText = 'Cliques: ' + cliques;
    }
  </script>

</body>
</html>
