<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma Semanal de Estudos</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --card-bg: #1e293b;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Barra Lateral Esquerda */
    aside {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--primary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button.btn-primary {
      background: var(--primary);
      color: #0f172a;
      border: none;
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text);
    }

    .subject-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .subject-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--surface-border);
      font-size: 0.85rem;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
    }

    /* Conteúdo Principal */
    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .grid-semana {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .day-title {
      font-size: 1rem;
      font-weight: bold;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 8px;
      color: var(--primary);
    }

    .study-slot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      background: var(--bg);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--surface-border);
    }

    .study-slot.concluido {
      text-decoration: line-through;
      color: var(--text-muted);
      border-color: var(--success);
    }
  </style>
</head>
<body>

  <!-- Menu Lateral Esquerdo -->
  <aside>
    <h2>Organizador</h2>

    <div class="form-group">
      <label for="novaMateria">Adicionar Disciplina:</label>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="novaMateria" placeholder="Ex: Direito Penal">
        <button class="btn-primary" onclick="adicionarMateria()">+</button>
      </div>
      <ul class="subject-list" id="listaMaterias"></ul>
    </div>

    <div class="form-group">
      <label for="materiasPorDia">Disciplinas por dia:</label>
      <input type="number" id="materiasPorDia" min="1" max="6" value="2">
    </div>

    <button class="btn-primary" onclick="gerarCronograma()">Reorganizar Estudos</button>
    <button class="btn-secondary" onclick="limparTudo()">Limpar Tudo</button>
  </aside>

  <!-- Área Principal -->
  <main>
    <div class="header-bar">
      <h1>Cronograma Semanal</h1>
      <button class="btn-secondary" onclick="alternarTema()" id="btnTema">☀️ Modo Claro</button>
    </div>

    <div class="grid-semana" id="gradeSemana"></div>
  </main>

  <script>
    const DIAS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
    
    let estado = {
      tema: 'dark',
      materias: ['Português', 'Raciocínio Lógico', 'Direito Constitucional', 'Direito Administrativo'],
      porDia: 2,
      cronograma: {}
    };

    function carregarDados() {
      const dadosSalvos = localStorage.getItem('cronograma_dados');
      if (dadosSalvos) {
        estado = JSON.parse(dadosSalvos);
      }
      document.body.setAttribute('data-theme', estado.tema);
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
      document.getElementById('materiasPorDia').value = estado.porDia;
      renderizarMaterias();
      if (Object.keys(estado.cronograma).length === 0) {
        gerarCronograma();
      } else {
        renderizarGrade();
      }
    }

    function guardarDados() {
      localStorage.setItem('cronograma_dados', JSON.stringify(estado));
    }

    function alternarTema() {
      estado.tema = estado.tema === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', estado.tema);
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
      guardarDados();
    }

    function renderizarMaterias() {
      const lista = document.getElementById('listaMaterias');
      lista.innerHTML = '';
      estado.materias.forEach((materia, index) => {
        const li = document.createElement('li');
        li.className = 'subject-item';
        li.innerHTML = `<span>${materia}</span><button class="btn-remove" onclick="removerMateria(${index})">&times;</button>`;
        lista.appendChild(li);
      });
    }

    function adicionarMateria() {
      const input = document.getElementById('novaMateria');
      const nome = input.value.trim();
      if (nome) {
        estado.materias.push(nome);
        input.value = '';
        renderizarMaterias();
        guardarDados();
      }
    }

    function removerMateria(index) {
      estado.materias.splice(index, 1);
      renderizarMaterias();
      guardarDados();
    }

    function gerarCronograma() {
      if (estado.materias.length === 0) {
        alert('Adicione pelo menos uma disciplina.');
        return;
      }

      estado.porDia = parseInt(document.getElementById('materiasPorDia').value) || 2;
      estado.cronograma = {};

      let indexMateria = 0;
      DIAS.forEach(dia => {
        estado.cronograma[dia] = [];
        for (let i = 0; i < estado.porDia; i++) {
          estado.cronograma[dia].push({
            materia: estado.materias[indexMateria % estado.materias.length],
            feito: false
          });
          indexMateria++;
        }
      });

      guardarDados();
      renderizarGrade();
    }

    function alternarStatus(dia, indice) {
      estado.cronograma[dia][indice].feito = !estado.cronograma[dia][indice].feito;
      guardarDados();
      renderizarGrade();
    }

    function renderizarGrade() {
      const grade = document.getElementById('gradeSemana');
      grade.innerHTML = '';

      DIAS.forEach(dia => {
        const card = document.createElement('div');
        card.className = 'day-card';

        const titulo = document.createElement('div');
        titulo.className = 'day-title';
        titulo.innerText = dia;
        card.appendChild(titulo);

        const listaEstudos = estado.cronograma[dia] || [];
        listaEstudos.forEach((item, idx) => {
          const slot = document.createElement('div');
          slot.className = `study-slot ${item.feito ? 'concluido' : ''}`;
          slot.innerHTML = `
            <input type="checkbox" ${item.feito ? 'checked' : ''} onchange="alternarStatus('${dia}', ${idx})">
            <span>${item.materia}</span>
          `;
          card.appendChild(slot);
        });

        grade.appendChild(card);
      });
    }

    function limparTudo() {
      if (confirm('Deseja reiniciar todas as configurações e matérias?')) {
        localStorage.removeItem('cronograma_dados');
        location.reload();
      }
    }

    carregarDados();
  </script>
</body>
</html>
