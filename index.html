<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo Inteligente - Plano & Ciclo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-hover: #1f293d;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --card-bg: #131c2e;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.12);
      --accent: #4f46e5;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    #tela-login {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .login-box h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
      color: var(--primary);
    }

    .login-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    #app-container {
      display: none;
      width: 100%;
      min-height: 100vh;
      flex-direction: row;
    }

    @media (max-width: 900px) {
      #app-container { flex-direction: column; }
      aside { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--border); }
      main { padding: 16px !important; }
    }

    aside {
      width: 390px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .user-tag {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tab-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 8px 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.70rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-color: transparent;
    }

    .tab-content {
      display: none;
      padding: 18px;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .tab-content.active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input, select, textarea {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #0b0f19; }
    .btn-success { background: var(--success); color: #ffffff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: transparent; border: 1px solid rgba(239, 68, 68, 0.4); color: var(--danger); }

    main { flex: 1; padding: 32px; overflow-y: auto; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .main-header h1 { font-size: 1.6rem; font-weight: 700; }
    .controls-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .day-column { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 250px; }
    .day-column.today { border-color: var(--primary); }

    .day-name { padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
    .day-title-text { font-size: 0.95rem; font-weight: 700; color: var(--primary); }

    .slot-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .slot-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .slot-card.done { border-color: var(--success); opacity: 0.65; }
    .slot-card.done .slot-materia-title, .slot-card.done .slot-assunto-sub { text-decoration: line-through; color: var(--text-muted); }

    .slot-materia-title { font-weight: 700; color: var(--primary); font-size: 0.85rem; display: block; }
    .slot-assunto-sub { font-size: 0.78rem; color: var(--text); }

    .badge-numero-cartao {
      display: inline-flex; font-size: 0.68rem; font-weight: 800; padding: 2px 7px;
      border-radius: 5px; background: rgba(56, 189, 248, 0.15); color: var(--primary); margin-bottom: 2px;
    }

    .prio-item-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .prio-options { display: flex; gap: 6px; }
    .btn-prio-tag { flex: 1; padding: 5px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 0.7rem; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-prio-tag.vermelho { color: var(--danger); }
    .btn-prio-tag.amarelo { color: var(--warning); }
    .btn-prio-tag.verde { color: var(--success); }
    .btn-prio-tag.active.vermelho { background: rgba(239, 68, 68, 0.2); }
    .btn-prio-tag.active.amarelo { background: rgba(245, 158, 11, 0.2); }
    .btn-prio-tag.active.verde { background: rgba(16, 185, 129, 0.2); }

    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <div id="tela-login">
    <div class="login-box">
      <h2>Estudo Inteligente</h2>
      <p>Introduza os dados para aceder ao painel</p>
      <div class="field" style="margin-bottom: 12px;">
        <label for="usuario">Utilizador</label>
        <input type="text" id="usuario" value="Eduardo">
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label for="senha">Palavra-passe</label>
        <input type="password" id="senha" value="333435">
      </div>
      <div id="msgErro" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 12px; display: none; text-align: center;">Dados incorretos!</div>
      <button class="btn btn-primary" style="width: 100%;" onclick="autenticar()">Entrar no Painel</button>
    </div>
  </div>

  <div id="app-container">
    <aside>
      <div class="sidebar-header">
        <h2>📚 Estudo Inteligente</h2>
        <div class="user-tag">Perfil: <span id="labelNomeUsuario" class="user-badge">Eduardo</span></div>
      </div>

      <nav class="tab-nav">
        <button class="tab-btn active" onclick="trocarAba('aba-ciclo', this)">Ciclo</button>
        <button class="tab-btn" onclick="trocarAba('aba-prioridades', this)">Prioridades</button>
        <button class="tab-btn" onclick="trocarAba('aba-edital-vert', this)">Edital</button>
      </nav>

      <!-- Aba Ciclo -->
      <div id="aba-ciclo" class="tab-content active">
        <div class="field">
          <label>Adicionar Disciplina</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="novaMateria" placeholder="Ex: Português">
            <button class="btn btn-primary" onclick="adicionarMateria()">+</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="gerarSemana()">⚡ Gerar / Atualizar Semana</button>
        <button class="btn btn-outline" onclick="reiniciarProgresso()">Limpar Checkboxes</button>
      </div>

      <!-- Aba Prioridades -->
      <div id="aba-prioridades" class="tab-content">
        <div id="containerListaPrioridades" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- Aba Edital -->
      <div id="aba-edital-vert" class="tab-content">
        <div class="field">
          <label>Adicionar Tópico</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="inputMateriaTopico" placeholder="Matéria">
            <input type="text" id="inputTituloTopico" placeholder="Assunto">
            <button class="btn btn-primary" onclick="adicionarTopico()">+</button>
          </div>
        </div>
        <div id="containerEdital" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-danger" onclick="resetarTudo()">🔄 Resetar Tudo</button>
        <button class="btn btn-outline" onclick="sair()">Terminar Sessão</button>
      </div>
    </aside>

    <main>
      <header class="main-header">
        <div>
          <h1>Cronograma Semanal</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Ciclo de matérias organizado e funcional</p>
        </div>
        <div class="controls-top">
          <button class="btn btn-outline" onclick="alternarTema()" id="btnTema">☀️ Claro</button>
        </div>
      </header>

      <section class="week-grid" id="gradeSemana"></section>
    </main>
  </div>

  <script>
    const DIAS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
    let usuarioAtivo = null;
    let estado = {
      disciplinas: [],
      editalVerticalizado: {},
      semanas: {},
      ponteiroGeral: 0,
      tema: 'dark'
    };

    function autenticar() {
      const u = document.getElementById('usuario').value.trim();
      const s = document.getElementById('senha').value.trim();
      if (u.toLowerCase() === 'eduardo' && s === '333435') {
        usuarioAtivo = 'Eduardo';
        sessionStorage.setItem('usuario_ativo', 'Eduardo');
        abrirApp();
      } else {
        document.getElementById('msgErro').style.display = 'block';
      }
    }

    function abrirApp() {
      document.getElementById('tela-login').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      
      const salvo = localStorage.getItem('estudo_inteligente_dados');
      if (salvo) {
        try { estado = JSON.parse(salvo); } catch(e) {}
      } else {
        // Exemplo padrão inicial
        estado.disciplinas = [{nome: 'Português', peso: 3}, {nome: 'Raciocínio Lógico', peso: 2}];
        estado.editalVerticalizado = {
          'Português': [{id:'t1', titulo:'1. Interpretação de Textos', t:false, prioridade:'vermelho'}, {id:'t2', titulo:'2. Crase', t:false, prioridade:'amarelo'}],
          'Raciocínio Lógico': [{id:'t3', titulo:'1. Proposições', t:false, prioridade:'vermelho'}]
        };
      }
      atualizarUI();
    }

    function salvarEstado() {
      localStorage.setItem('estudo_inteligente_dados', JSON.stringify(estado));
    }

    function trocarAba(id, btn) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      if (id === 'aba-prioridades') renderizarAbaPrioridades();
      if (id === 'aba-edital-vert') renderizarEdital();
    }

    function alternarTema() {
      estado.tema = estado.tema === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', estado.tema);
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Claro' : '🌙 Escuro';
      salvarEstado();
    }

    function adicionarMateria() {
      const input = document.getElementById('novaMateria');
      const nome = input.value.trim();
      if (!nome) return;
      if (!estado.disciplinas.some(d => d.nome === nome)) {
        estado.disciplinas.push({ nome, peso: 3 });
        if (!estado.editalVerticalizado[nome]) estado.editalVerticalizado[nome] = [];
        input.value = '';
        salvarEstado();
        gerarSemana();
      }
    }

    function adicionarTopico() {
      const m = document.getElementById('inputMateriaTopico').value.trim();
      const t = document.getElementById('inputTituloTopico').value.trim();
      if (!m || !t) return;
      if (!estado.editalVerticalizado[m]) estado.editalVerticalizado[m] = [];
      estado.editalVerticalizado[m].push({ id: 'tp_' + Date.now(), titulo: t, t: false, prioridade: 'amarelo' });
      document.getElementById('inputMateriaTopico').value = '';
      document.getElementById('inputTituloTopico').value = '';
      salvarEstado();
      renderizarEdital();
    }

    function renderizarEdital() {
      const c = document.getElementById('containerEdital');
      if (!c) return; c.innerHTML = '';
      Object.keys(estado.editalVerticalizado || {}).forEach(m => {
        const tops = estado.editalVerticalizado[m] || [];
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `<span><strong>${m}</strong> (${tops.length} tópicos)</span>`;
        c.appendChild(div);
      });
    }

    function renderizarAbaPrioridades() {
      const c = document.getElementById('containerListaPrioridades');
      if (!c) return; c.innerHTML = '';
      Object.keys(estado.editalVerticalizado || {}).forEach(m => {
        (estado.editalVerticalizado[m] || []).forEach(t => {
          const card = document.createElement('div');
          card.className = 'prio-item-card';
          card.innerHTML = `
            <div class="prio-topic-title">${m} — ${t.titulo}</div>
            <div class="prio-options">
              <button class="btn-prio-tag vermelho ${t.prioridade==='vermelho'?'active':''}" onclick="definirPrio('${m}','${t.id}','vermelho')">🔴 Alta</button>
              <button class="btn-prio-tag amarelo ${t.prioridade==='amarelo'?'active':''}" onclick="definirPrio('${m}','${t.id}','amarelo')">🟡 Média</button>
              <button class="btn-prio-tag verde ${t.prioridade==='verde'?'active':''}" onclick="definirPrio('${m}','${t.id}','verde')">🟢 Baixa</button>
            </div>
          `;
          c.appendChild(card);
        });
      });
    }

    function definirPrio(m, id, p) {
      const tp = (estado.editalVerticalizado[m] || []).find(t => t.id === id);
      if (tp) { tp.prioridade = p; salvarEstado(); renderizarAbaPrioridades(); }
    }

    function obterTotalTopicos() {
      let total = 0;
      Object.keys(estado.editalVerticalizado || {}).forEach(m => {
        total += (estado.editalVerticalizado[m] || []).length;
      });
      return total;
    }

    function gerarSemana() {
      if (estado.disciplinas.length === 0) return;
      const chave = 'semana_atual';
      const semanaAntiga = estado.semanas[chave] || {};
      const novaSemana = {};
      
      let ciclo = [];
      estado.disciplinas.forEach(d => {
        for(let i=0; i<d.peso; i++) ciclo.push(d.nome);
      });

      let ponteiro = estado.ponteiroGeral || 0;
      const totalTopicos = obterTotalTopicos();

      DIAS.forEach(dia => {
        const slotsAntigos = semanaAntiga[dia] || [];
        const slotsDia = [];

        // Preserva rigorosamente os checkboxes já marcados
        slotsAntigos.forEach(s => { if (s.feito) slotsDia.push(s); });

        while (slotsDia.length < 2) {
          if (totalTopicos > 0 && ponteiro >= totalTopicos) break;
          const materia = ciclo[ponteiro % ciclo.length];
          ponteiro++;
          
          const topicosMat = (estado.editalVerticalizado[materia] || []).filter(t => !t.t);
          const topicoEscolhido = topicosMat.length > 0 ? topicosMat[0] : null;

          slotsDia.push({
            id: 'slot_' + Math.random().toString(36).substr(2,6),
            materia: materia,
            assunto: topicoEscolhido ? topicoEscolhido.titulo : 'Revisão Geral',
            topicoId: topicoEscolhido ? topicoEscolhido.id : null,
            numeroCartao: (ponteiro % (totalTopicos || 1)) + 1,
            feito: false
          });
        }
        novaSemana[dia] = slotsDia;
      });

      estado.ponteiroGeral = ponteiro;
      estado.semanas[chave] = novaSemana;
      salvarEstado();
      renderizarGrade();
    }

    function renderizarGrade() {
      const grade = document.getElementById('gradeSemana');
      if (!grade) return;
      grade.innerHTML = '';

      const chave = 'semana_atual';
      const semana = estado.semanas[chave] || {};
      const totalTopicos = obterTotalTopicos();

      DIAS.forEach(dia => {
        const slots = semana[dia] || [];
        const col = document.createElement('div');
        col.className = 'day-column';

        let htmlSlots = '';
        slots.forEach((slot, idx) => {
          htmlSlots += `
            <div class="slot-card ${slot.feito ? 'done' : ''}">
              <div class="slot-left">
                <input type="checkbox" ${slot.feito ? 'checked' : ''} onchange="toggleSlot('${dia}', ${idx}, this.checked)">
                <div class="slot-texts">
                  ${totalTopicos > 0 && slot.numeroCartao ? `<span class="badge-numero-cartao">#${slot.numeroCartao} de${totalTopicos}</span>` : ''}
                  <span class="slot-materia-title">${slot.materia}</span>
                  <span class="slot-assunto-sub">${slot.assunto}</span>
                </div>
              </div>
            </div>
          `;
        });

        if (slots.length === 0) htmlSlots = `<div style="font-size:0.78rem; color:var(--text-muted); text-align:center;">Livre</div>`;

        col.innerHTML = `
          <div class="day-name"><span class="day-title-text">${dia}</span></div>
          <div class="slot-list">${htmlSlots}</div>
        `;
        grade.appendChild(col);
      });
    }

    function toggleSlot(dia, idx, valor) {
      const semana = estado.semanas['semana_atual'];
      if (!semana || !semana[dia] || !semana[dia][idx]) return;
      
      const slot = semana[dia][idx];
      slot.feito = valor;

      if (slot.topicoId) {
        Object.keys(estado.editalVerticalizado).forEach(m => {
          (estado.editalVerticalizado[m] || []).forEach(t => { if (t.id === slot.topicoId) t.t = valor; });
        });
      }

      salvarEstado();
      renderizarGrade();
    }

    function reiniciarProgresso() {
      if (!confirm('Limpar marcações de feito?')) return;
      const semana = estado.semanas['semana_atual'];
      if (semana) { Object.keys(semana).forEach(d => semana[d].forEach(s => s.feito = false)); }
      salvarEstado();
      renderizarGrade();
    }

    function resetarTudo() {
      if (!confirm('Deseja apagar todos os dados e reiniciar?')) return;
      localStorage.removeItem('estudo_inteligente_dados');
      location.reload();
    }

    function sair() {
      sessionStorage.removeItem('usuario_ativo');
      location.reload();
    }

    function atualizarUI() {
      document.documentElement.setAttribute('data-theme', estado.tema || 'dark');
      document.getElementById('btnTema').innerText = estado.tema === 'dark' ? '☀️ Claro' : '🌙 Escuro';
      if (!estado.semanas['semana_atual'] || Object.keys(estado.semanas['semana_atual']).length === 0) {
        gerarSemana();
      } else {
        renderizarGrade();
      }
    }

    const sessao = sessionStorage.getItem('usuario_ativo');
    if (sessao && sessao.toLowerCase() === 'eduardo') {
      usuarioAtivo = 'Eduardo';
      document.getElementById('labelNomeUsuario').innerText = 'Eduardo';
      abrirApp();
    }
  </script>
</body>
</html>
